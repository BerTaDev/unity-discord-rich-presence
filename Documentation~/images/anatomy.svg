<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">What each RichPresence call shows on Discord</title>
<desc id="desc">A Discord profile card with numbered parts, and a legend mapping each number to the RichPresence method that sets it.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#1D2433"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5865F2" stop-opacity="0.28"/><stop offset="1" stop-color="#5865F2" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A3242"/></pattern>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#B45CF0"/></linearGradient>
<linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#9B6CF6"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
<linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5670"/></marker>
<clipPath id="frame"><rect x="0" y="0" width="1040" height="560" rx="16"/></clipPath>
</defs>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; font-variant-ligatures: none; }
</style>
<g clip-path="url(#frame)"><rect x="0" y="0" width="1040" height="560" fill="url(#bg)" rx="0"/><rect x="500" y="0" width="540" height="560" fill="url(#dots)" rx="0"/></g><rect x="0.5" y="0.5" width="1039" height="559" fill="none" rx="16" stroke="#2A3242" stroke-width="1"/><text x="40" y="50" font-size="22" fill="#F0F4FA" font-weight="700">What each call shows on Discord</text><text x="40" y="76" font-size="14.5" fill="#A7B1C2">Every field is optional. Empty ones are simply left out.</text><g transform="translate(40,100)"><clipPath id="cardclip"><rect x="0" y="0" width="440" height="428" rx="14"/></clipPath><rect x="0" y="0" width="440" height="428" fill="#232428" rx="14" filter="url(#shadow)"/><g clip-path="url(#cardclip)"><rect x="0" y="0" width="440" height="60" fill="url(#strip)" rx="0"/></g><rect x="0.5" y="0.5" width="439" height="427" fill="none" rx="14" stroke="#3F4147" stroke-width="1"/><circle cx="56" cy="64" r="40" fill="#232428"/><circle cx="56" cy="64" r="34" fill="url(#face)"/><text x="56" y="75" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">N</text><circle cx="82" cy="90" r="11" fill="#232428"/><circle cx="82" cy="90" r="7" fill="#23A55A"/><text x="20" y="126" font-size="20" fill="#F2F3F5" font-weight="700">Nova</text><text x="20" y="146" font-size="13" fill="#B5BAC1">@nova</text><rect x="20" y="164" width="400" height="1" fill="#3F4147" rx="0"/><text x="20" y="192" font-size="12" fill="#B5BAC1" font-weight="700" letter-spacing="0.6">PLAYING A GAME</text><rect x="20" y="204" width="100" height="100" fill="url(#art)" rx="12.0"/><g transform="translate(40.0,222.0) scale(2.5)" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9.5l2.5 1.2V7h2.5v2.2h2.4V7h3.2v2.2h2.4V7h2.5v3.7L21 9.5V21h-6.2v-4.2a2.8 2.8 0 0 0-5.6 0V21z"/></g><rect x="40.0" y="284.0" width="60.0" height="3.5000000000000004" fill="#FFFFFF" rx="1" fill-opacity="0.5"/><circle cx="110" cy="296" r="22" fill="#232428"/><circle cx="110" cy="296" r="18" fill="url(#badge)"/><g transform="translate(98.84,284.84) scale(0.93)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 6.5 14 2h3v3l-4.5 4.5M5 14l-2 2M3 19l2 2"/></g><text x="140" y="226" font-size="15" fill="#F2F3F5" font-weight="700">My Awesome Game</text><text x="140" y="250" font-size="14" fill="#DBDEE1">Exploring the dungeon</text><text x="140" y="274" font-size="14" fill="#DBDEE1">Floor 3 (1 of 4)</text><text x="140" y="298" font-size="14" fill="#DBDEE1">12:34 elapsed</text><rect x="20" y="324" width="380" height="36" fill="#4E5058" rx="6"/><text x="210" y="347" font-size="14" fill="#F2F3F5" font-weight="600" text-anchor="middle">Play for free</text><rect x="20" y="368" width="380" height="36" fill="#4E5058" rx="6"/><text x="210" y="391" font-size="14" fill="#F2F3F5" font-weight="600" text-anchor="middle">Join our Discord</text><circle cx="422" cy="188" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="422" y="192.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><circle cx="20" cy="204" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="20" y="208.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><circle cx="124" cy="282" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="124" y="286.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><circle cx="422" cy="222" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="422" y="226.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><circle cx="422" cy="246" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="422" y="250.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><circle cx="422" cy="270" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="422" y="274.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><circle cx="422" cy="294" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="422" y="298.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><circle cx="420" cy="364" r="12" fill="#5865F2" stroke="#232428" stroke-width="2.5"/><text x="420" y="368.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text></g><circle cx="536" cy="123" r="12" fill="#5865F2"/><text x="536" y="127.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="560" y="128" font-size="14" fill="#6CB4FF" class="mono">WithType(ActivityType.Playing)</text><text x="560" y="149" font-size="13" fill="#A7B1C2">Playing, Listening to, Watching or Competing in</text><circle cx="536" cy="175" r="12" fill="#5865F2"/><text x="536" y="179.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="560" y="180" font-size="14" fill="#6CB4FF" class="mono">WithLargeImage("logo", "My Game")</text><text x="560" y="201" font-size="13" fill="#A7B1C2">Art Asset name or https:// image URL; text is the tooltip</text><circle cx="536" cy="227" r="12" fill="#5865F2"/><text x="536" y="231.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="560" y="232" font-size="14" fill="#6CB4FF" class="mono">WithSmallImage("warrior", "Level 12 Warrior")</text><text x="560" y="253" font-size="13" fill="#A7B1C2">Small round badge on the corner of the large image</text><circle cx="536" cy="279" r="12" fill="#5865F2"/><text x="536" y="283.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="560" y="284" font-size="14" fill="#F0F4FA" font-weight="700">Application name</text><text x="560" y="305" font-size="13" fill="#A7B1C2">Set in the Discord Developer Portal, not in code</text><circle cx="536" cy="331" r="12" fill="#5865F2"/><text x="536" y="335.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="560" y="336" font-size="14" fill="#6CB4FF" class="mono">WithDetails("Exploring the dungeon")</text><text x="560" y="357" font-size="13" fill="#A7B1C2">First line, 2 to 128 characters</text><circle cx="536" cy="383" r="12" fill="#5865F2"/><text x="536" y="387.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="560" y="388" font-size="14" fill="#6CB4FF" class="mono">WithState("Floor 3").WithParty(1, 4)</text><text x="560" y="409" font-size="13" fill="#A7B1C2">Second line; the party is shown as (1 of 4)</text><circle cx="536" cy="435" r="12" fill="#5865F2"/><text x="536" y="439.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><text x="560" y="440" font-size="14" fill="#6CB4FF" class="mono">WithElapsedTime()</text><text x="560" y="461" font-size="13" fill="#A7B1C2">Or WithCountdown(…) to show the time left</text><circle cx="536" cy="487" r="12" fill="#5865F2"/><text x="536" y="491.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><text x="560" y="492" font-size="14" fill="#6CB4FF" class="mono">WithButton("Play for free", url)</text><text x="560" y="513" font-size="13" fill="#A7B1C2">Up to two links. Other people see them, you don't</text>
</svg>
