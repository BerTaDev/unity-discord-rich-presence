<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
<title id="title">Discord Rich Presence for Unity</title>
<desc id="desc">Package banner with an example Discord activity card and the one line of code that updates it.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#1D2433"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5865F2" stop-opacity="0.28"/><stop offset="1" stop-color="#5865F2" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A3242"/></pattern>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#B45CF0"/></linearGradient>
<linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#9B6CF6"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
<linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5670"/></marker>
<clipPath id="frame"><rect x="0" y="0" width="1040" height="320" rx="16"/></clipPath>
</defs>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; font-variant-ligatures: none; }
</style>
<g clip-path="url(#frame)"><rect x="0" y="0" width="1040" height="320" fill="url(#bg)" rx="0"/><rect x="560" y="0" width="480" height="320" fill="url(#dots)" rx="0"/></g><rect x="0.5" y="0.5" width="1039" height="319" fill="none" rx="16" stroke="#2A3242" stroke-width="1"/><g clip-path="url(#frame)"><circle cx="800" cy="150" r="300" fill="url(#glow)"/></g><text x="56" y="88" font-size="12.5" fill="#8EA1FF" font-weight="700" letter-spacing="2.5">UNITY PACKAGE</text><text x="54" y="138" font-size="40" fill="#F0F4FA" font-weight="700">Discord Rich Presence</text><text x="56" y="176" font-size="17" fill="#A7B1C2">Show what players are doing in your game on</text><text x="56" y="200" font-size="17" fill="#A7B1C2">their Discord profile. Pure C#, no native DLLs.</text><rect x="56" y="220" width="486" height="34" fill="#0F131A" rx="17" stroke="#2C3546" stroke-width="1"/><text x="76" y="242" font-size="12.5" fill="#C9D4E5" class="mono">com.bertadev.discord-rich-presence  ·  v1.0.0  ·  Unity 2021.3+</text><rect x="56" y="274" width="192.70000000000002" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><circle cx="71" cy="288" r="4" fill="#6CB4FF"/><text x="82" y="292.5" font-size="12.5" fill="#C9D4E5">Windows · macOS · Linux</text><rect x="256.70000000000005" y="274" width="123.7" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><circle cx="271.70000000000005" cy="288" r="4" fill="#8EA1FF"/><text x="282.70000000000005" y="292.5" font-size="12.5" fill="#C9D4E5">Mono &amp; IL2CPP</text><rect x="388.40000000000003" y="274" width="151.3" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><circle cx="403.40000000000003" cy="288" r="4" fill="#57F287"/><text x="414.40000000000003" y="292.5" font-size="12.5" fill="#C9D4E5">Zero dependencies</text><g transform="translate(598,34) scale(0.9)"><clipPath id="cardclip"><rect x="0" y="0" width="440" height="222" rx="14"/></clipPath><rect x="0" y="0" width="440" height="222" fill="#232428" rx="14" filter="url(#shadow)"/><g clip-path="url(#cardclip)"></g><rect x="0.5" y="0.5" width="439" height="221" fill="none" rx="14" stroke="#3F4147" stroke-width="1"/><text x="20" y="30" font-size="12" fill="#B5BAC1" font-weight="700" letter-spacing="0.6">PLAYING A GAME</text><rect x="20" y="42" width="100" height="100" fill="url(#art)" rx="12.0"/><g transform="translate(40.0,60.0) scale(2.5)" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9.5l2.5 1.2V7h2.5v2.2h2.4V7h3.2v2.2h2.4V7h2.5v3.7L21 9.5V21h-6.2v-4.2a2.8 2.8 0 0 0-5.6 0V21z"/></g><rect x="40.0" y="122.0" width="60.0" height="3.5000000000000004" fill="#FFFFFF" rx="1" fill-opacity="0.5"/><circle cx="110" cy="134" r="22" fill="#232428"/><circle cx="110" cy="134" r="18" fill="url(#badge)"/><g transform="translate(98.84,122.84) scale(0.93)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 6.5 14 2h3v3l-4.5 4.5M5 14l-2 2M3 19l2 2"/></g><text x="140" y="64" font-size="15" fill="#F2F3F5" font-weight="700">My Awesome Game</text><text x="140" y="88" font-size="14" fill="#DBDEE1">Exploring the dungeon</text><text x="140" y="112" font-size="14" fill="#DBDEE1">Floor 3 (1 of 4)</text><text x="140" y="136" font-size="14" fill="#DBDEE1">12:34 elapsed</text><rect x="20" y="162" width="400" height="36" fill="#4E5058" rx="6"/><text x="220" y="185" font-size="14" fill="#F2F3F5" font-weight="600" text-anchor="middle">Play for free</text></g><rect x="598" y="248" width="396" height="38" fill="#0F131A" rx="9" stroke="#2C3546" stroke-width="1"/><text x="614" y="272" font-size="12.5" fill="#6CB4FF" class="mono">DiscordPresence.Update(p =&gt; p.State = "Floor 3");</text>
</svg>
