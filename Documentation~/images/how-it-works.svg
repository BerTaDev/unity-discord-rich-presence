<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="476" viewBox="0 0 1040 476" role="img" aria-labelledby="title desc">
<title id="title">How the package talks to Discord</title>
<desc id="desc">Main thread calls are serialized and handed to a worker thread, which coalesces, rate limits and writes them to the Discord IPC pipe; events come back on the main thread.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#1D2433"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5865F2" stop-opacity="0.28"/><stop offset="1" stop-color="#5865F2" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A3242"/></pattern>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#B45CF0"/></linearGradient>
<linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#9B6CF6"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
<linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A5670"/></marker>
<clipPath id="frame"><rect x="0" y="0" width="1040" height="476" rx="16"/></clipPath>
</defs>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; font-variant-ligatures: none; }
</style>
<g clip-path="url(#frame)"><rect x="0" y="0" width="1040" height="476" fill="url(#bg)" rx="0"/></g><rect x="0.5" y="0.5" width="1039" height="475" fill="none" rx="16" stroke="#2A3242" stroke-width="1"/><text x="40" y="50" font-size="22" fill="#F0F4FA" font-weight="700">How it works</text><text x="40" y="76" font-size="14.5" fill="#A7B1C2">Your code never waits for Discord. One background thread does all the talking.</text><rect x="40" y="100" width="280" height="262" fill="#1A202B" rx="14" stroke="#2A3242" stroke-width="1"/><rect x="40" y="100" width="280" height="4" fill="#6CB4FF" rx="2"/><text x="60" y="132" font-size="11.5" fill="#6CB4FF" font-weight="700" letter-spacing="1.8">YOUR GAME</text><text x="60" y="156" font-size="18" fill="#F0F4FA" font-weight="700">Main thread</text><rect x="380" y="100" width="280" height="262" fill="#1A202B" rx="14" stroke="#2A3242" stroke-width="1"/><rect x="380" y="100" width="280" height="4" fill="#8EA1FF" rx="2"/><text x="400" y="132" font-size="11.5" fill="#8EA1FF" font-weight="700" letter-spacing="1.8">BACKGROUND</text><text x="400" y="156" font-size="18" fill="#F0F4FA" font-weight="700">Worker thread</text><rect x="720" y="100" width="280" height="262" fill="#1A202B" rx="14" stroke="#2A3242" stroke-width="1"/><rect x="720" y="100" width="280" height="4" fill="#57F287" rx="2"/><text x="740" y="132" font-size="11.5" fill="#57F287" font-weight="700" letter-spacing="1.8">DISCORD</text><text x="740" y="156" font-size="18" fill="#F0F4FA" font-weight="700">Desktop app</text><text x="60" y="192" font-size="13.5" fill="#C9D4E5" class="mono">DiscordPresence.Set(p)</text><text x="60" y="216" font-size="13.5" fill="#C9D4E5" class="mono">DiscordPresence.Update(…)</text><text x="60" y="240" font-size="13.5" fill="#C9D4E5" class="mono">DiscordPresence.Clear()</text><rect x="60" y="266" width="240" height="34" fill="#0F131A" rx="8" stroke="#2C3546" stroke-width="1"/><text x="180" y="288" font-size="13" fill="#A7B1C2" text-anchor="middle">validate + serialize to JSON</text><text x="60" y="334" font-size="13.5" fill="#F0F4FA" font-weight="600">Returns right away.</text><text x="60" y="352" font-size="13" fill="#A7B1C2">Safe to call every frame.</text><circle cx="410" cy="187" r="10" fill="#262E3D" stroke="#8EA1FF" stroke-width="1.2"/><text x="410" y="191.2" font-size="11.5" fill="#8EA1FF" font-weight="700" text-anchor="middle">1</text><text x="430" y="192" font-size="14" fill="#F0F4FA">Keep only the newest presence</text><circle cx="410" cy="217" r="10" fill="#262E3D" stroke="#8EA1FF" stroke-width="1.2"/><text x="410" y="221.2" font-size="11.5" fill="#8EA1FF" font-weight="700" text-anchor="middle">2</text><text x="430" y="222" font-size="14" fill="#F0F4FA">Skip it if nothing changed</text><circle cx="410" cy="247" r="10" fill="#262E3D" stroke="#8EA1FF" stroke-width="1.2"/><text x="410" y="251.2" font-size="11.5" fill="#8EA1FF" font-weight="700" text-anchor="middle">3</text><text x="430" y="252" font-size="14" fill="#F0F4FA">At most 5 updates per 20 s</text><circle cx="410" cy="277" r="10" fill="#262E3D" stroke="#8EA1FF" stroke-width="1.2"/><text x="410" y="281.2" font-size="11.5" fill="#8EA1FF" font-weight="700" text-anchor="middle">4</text><text x="430" y="282" font-size="14" fill="#F0F4FA">Write a frame to the pipe</text><text x="400" y="334" font-size="13.5" fill="#F0F4FA" font-weight="600">Discord closed or restarted?</text><text x="400" y="352" font-size="13" fill="#A7B1C2">Reconnects (1 s → 15 s) and restores it.</text><text x="740" y="190" font-size="12.5" fill="#A7B1C2">Windows</text><text x="740" y="210" font-size="13.5" fill="#C9D4E5" class="mono">\\.\pipe\discord-ipc-0</text><text x="740" y="236" font-size="12.5" fill="#A7B1C2">macOS / Linux</text><text x="740" y="256" font-size="13.5" fill="#C9D4E5" class="mono">$TMPDIR/discord-ipc-0</text><rect x="740" y="280" width="240" height="64" fill="#232428" rx="10" stroke="#3F4147" stroke-width="1"/><rect x="752" y="292" width="40" height="40" fill="url(#art)" rx="4.8"/><g transform="translate(760.0,299.2) scale(1.0)" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9.5l2.5 1.2V7h2.5v2.2h2.4V7h3.2v2.2h2.4V7h2.5v3.7L21 9.5V21h-6.2v-4.2a2.8 2.8 0 0 0-5.6 0V21z"/></g><rect x="760.0" y="324.0" width="24.0" height="1.4000000000000001" fill="#FFFFFF" rx="1" fill-opacity="0.5"/><text x="804" y="307" font-size="13.5" fill="#F2F3F5" font-weight="700">My Awesome Game</text><text x="804" y="327" font-size="12.5" fill="#DBDEE1">Exploring the dungeon</text><path d="M324 231 H374" stroke="#4A5670" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="222" font-size="11" fill="#6B7688" font-weight="600" text-anchor="middle">JSON</text><path d="M664 231 H714" stroke="#4A5670" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="222" font-size="11" fill="#6B7688" font-weight="600" text-anchor="middle">IPC frame</text><path d="M860 362 V404 H180 V368" fill="none" stroke="#4A5670" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="390" y="392" width="260" height="24" fill="#1D2433" rx="12"/><text x="520" y="408.5" font-size="12" fill="#6B7688" font-weight="700" text-anchor="middle" letter-spacing="1">READY · ERROR · CLOSE</text><rect x="196" y="428" width="94.89999999999999" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><text x="243.45" y="446.5" font-size="13" fill="#6CB4FF" text-anchor="middle" class="mono">Connected</text><rect x="298.9" y="428" width="119.19999999999999" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><text x="358.5" y="446.5" font-size="13" fill="#6CB4FF" text-anchor="middle" class="mono">Disconnected</text><rect x="426.09999999999997" y="428" width="62.5" height="28" fill="#0F131A" rx="14" stroke="#2C3546" stroke-width="1"/><text x="457.34999999999997" y="446.5" font-size="13" fill="#6CB4FF" text-anchor="middle" class="mono">Error</text><text x="502.59999999999997" y="446.5" font-size="13.5" fill="#A7B1C2">events are raised on the main thread, next frame</text>
</svg>
